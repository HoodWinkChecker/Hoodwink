<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan · Hoodwink</title>
<meta name="description" content="Hoodwink report on a Robinhood Chain token: ticker copies, real or borrowed links, deployer track record, snipers, top 10 and an AI verdict, with evidence for every finding.">
<meta property="og:title" content="Hoodwink scan report">
<meta property="og:url" content="https://www.hoodwink.site/scan.html">
<meta property="og:image" content="https://www.hoodwink.site/assets/img/og.png">
<meta name="twitter:site" content="@CheckHoodWink">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#08090b">
<link rel="canonical" href="https://www.hoodwink.site/scan.html">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/mona-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/hw.css">
<script src="config.js"></script>
</head>
<body data-page="scan">
<a class="skip" href="#main">Skip to content</a>
<div class="split">
  <aside class="instrument" id="inst"></aside>
  <main class="content" id="main">
    <header class="rep-head" id="repHead">
      <div class="label" id="repKicker">Investigation</div>
      <div class="rep-title"><h1 class="h2" id="repTitle">Reading the chain…</h1></div>
      <div class="rep-sub" id="repSub"></div>
      <div id="glance"></div>
      <div class="progress" id="progress"><span id="stageText">Starting</span><span class="pbar"><i id="pbar"></i></span><span id="stageN"></span></div>
      <div id="repSummary"></div>
      <form class="scanbox" id="scanForm" autocomplete="off" style="margin-top:28px;display:none">
        <input id="addr" spellcheck="false" placeholder="0x… token address on Robinhood Chain" aria-label="Token address">
        <button type="submit">Scan</button>
      </form>
    </header>
    <div class="widgets" id="widgets" hidden></div>
    <div id="groups"></div>
    <footer class="foot" id="foot"></footer>
  </main>
</div>
<script type="module" src="assets/js/report.js"></script>
</body>
</html>

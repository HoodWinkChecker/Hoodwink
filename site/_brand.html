<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="assets/css/hw.css">
<style>
html,body{margin:0;background:#0a0a0a;overflow:hidden}
.box{position:relative;display:grid;place-items:center;overflow:hidden;background:#0a0a0a}
.grid{position:absolute;inset:0;background-image:linear-gradient(#171716 1px,transparent 1px),linear-gradient(90deg,#171716 1px,transparent 1px);background-size:40px 40px;opacity:.7;mask-image:radial-gradient(ellipse at 50% 50%,#000,transparent 72%);-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000,transparent 72%)}
.glow{position:absolute;width:50%;height:50%;border-radius:50%;background:radial-gradient(circle,rgba(205,247,49,.10),transparent 65%)}
.m{position:relative;display:block}
.m svg{width:100%;height:100%;display:block}
.word{font-family:var(--display);font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:.01em;color:#f4f2ec}
</style></head>
<body><div id="out"></div>
<script type="module">
import { MARK } from './assets/js/site.js';
const k = new URLSearchParams(location.search).get('k');
const mk = (s, dark) => `<span class="m" style="width:${s}px;height:${s}px">${dark ? MARK.replace('#f4f2ec', '#0a0a0a').replace('#cdf731', '#9dbf14') : MARK}</span>`;
const out = document.getElementById('out');
if (k === 'avatar') out.innerHTML = `<div class="box" style="width:400px;height:400px"><div class="grid"></div><div class="glow"></div>${mk(250)}</div>`;
else if (k === 'pons') out.innerHTML = `<div class="box" style="width:1000px;height:1000px"><div class="grid" style="background-size:80px 80px"></div><div class="glow"></div>${mk(640)}</div>`;
else if (k === 'banner') out.innerHTML = `<div class="box" style="width:1500px;height:500px;place-items:center end;padding-right:120px;box-sizing:border-box"><div class="grid"></div>
  <div style="position:relative;text-align:right"><div class="word" style="font-size:118px;line-height:.9">Real or <span style="color:#cdf731">LARP?</span></div>
  <div style="font-family:var(--mono);font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#7d8088;margin-top:26px">Token checks for Robinhood Chain · paste a CA</div></div></div>`;
else if (k === 'lockup') out.innerHTML = `<div class="box" style="width:1600px;height:500px"><div style="display:flex;align-items:center;gap:56px">${mk(280)}<span class="word" style="font-size:150px">Hoodwink</span></div></div>`;
else if (k === 'lockup-light') out.innerHTML = `<div class="box" style="width:1600px;height:500px;background:#f4f2ec"><div style="display:flex;align-items:center;gap:56px">${mk(280, true)}<span class="word" style="font-size:150px;color:#0a0a0a">Hoodwink</span></div></div>`;
window.ready = true;
</script></body></html>
